name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: carebridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d carebridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/carebridge?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Migrate up, down, up
        run: |
          migrate -path db/migration -database "$DATABASE_URL" up
          migrate -path db/migration -database "$DATABASE_URL" down -all
          migrate -path db/migration -database "$DATABASE_URL" up
      - name: Test
        run: go test ./... -race -cover